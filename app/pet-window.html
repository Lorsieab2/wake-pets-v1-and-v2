<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Window</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    .pet {
      position: absolute;
      left: 0;
      top: 0;
      width: 192px;
      height: 208px;
      background-repeat: no-repeat;
      background-size: auto;
      filter: drop-shadow(0 14px 12px rgba(0, 0, 0, 0.3));
      transform-origin: 0 0;
      cursor: grab;
      touch-action: none;
    }

    .pet.dragging {
      cursor: grabbing;
    }

    .label {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 0;
      bottom: auto;
      transform: translateX(-50%);
      max-width: calc(100% - 8px);
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(12, 14, 18, 0.72);
      color: rgba(255, 255, 255, 0.92);
      font: 11px/15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <section id="pet" class="pet" aria-label="Pet"></section>
  <div id="label" class="label"></div>

  <script>
    const DEFAULT_ATLAS = {
      columns: 8,
      rows: 9,
      cellWidth: 192,
      cellHeight: 208,
      width: 1536,
      height: 1872
    };
    const IDLE_ROW = 0;
    const RUN_RIGHT_ROW = 1;
    const RUN_LEFT_ROW = 2;
    const IDLE_ROWS = [0, 3, 4, 5, 6, 7, 8];
    const LABEL_GAP = 4;
    const ACTIVE_FRAME_MS = 105;
    const IDLE_FRAME_MS = 160;
    const IDLE_BURST_MIN_DELAY_MS = 4500;
    const IDLE_BURST_MAX_DELAY_MS = 11000;
    const ROW_FRAME_COUNTS = {
      0: 6,
      1: 8,
      2: 8,
      3: 4,
      4: 5,
      5: 8,
      6: 6,
      7: 6,
      8: 6
    };

    const pet = document.getElementById("pet");
    const label = document.getElementById("label");

    let frame = 0;
    let row = IDLE_ROW;
    let atlas = { ...DEFAULT_ATLAS };
    let vx = 0;
    let vy = 0;
    let motionState = "idle";
    let forcedRow = IDLE_ROW;
    let idleAnimationSpeed = 1;
    let lastFrameAt = performance.now();
    let activePointerId = null;
    let isHovered = false;
    let idleBursting = false;
    let idleBurstFramesRemaining = 0;
    let nextIdleBurstAt = 0;
    let facingRow = RUN_RIGHT_ROW;
    let hoverRow = IDLE_ROW;

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function randomIdleRow() {
      return IDLE_ROWS[Math.floor(Math.random() * IDLE_ROWS.length)];
    }

    function scheduleNextIdleBurst(now = performance.now()) {
      idleBursting = false;
      idleBurstFramesRemaining = 0;
      nextIdleBurstAt = now + randomRange(IDLE_BURST_MIN_DELAY_MS, IDLE_BURST_MAX_DELAY_MS);
    }

    function nonRunningRow(value) {
      return value === RUN_RIGHT_ROW || value === RUN_LEFT_ROW ? IDLE_ROW : value;
    }

    scheduleNextIdleBurst(lastFrameAt);

    function screenPoint(event) {
      return { x: Math.round(event.screenX), y: Math.round(event.screenY) };
    }

    window.petOverlay.onConfig((config) => {
      const nextAtlas = config.atlas || {};
      atlas = {
        columns: Number(nextAtlas.columns) || DEFAULT_ATLAS.columns,
        rows: Number(nextAtlas.rows) || DEFAULT_ATLAS.rows,
        cellWidth: Number(nextAtlas.cellWidth) || DEFAULT_ATLAS.cellWidth,
        cellHeight: Number(nextAtlas.cellHeight) || DEFAULT_ATLAS.cellHeight,
        width: Number(nextAtlas.width) || DEFAULT_ATLAS.width,
        height: Number(nextAtlas.height) || DEFAULT_ATLAS.height
      };
      pet.style.backgroundImage = `url("${config.sprite}")`;
      pet.style.width = `${atlas.cellWidth}px`;
      pet.style.height = `${atlas.cellHeight}px`;
      pet.style.backgroundSize = `${atlas.width}px ${atlas.height}px`;
      pet.style.transform = `scale(${config.scale})`;
      label.style.top = `${atlas.cellHeight * Number(config.scale) + LABEL_GAP}px`;
      pet.setAttribute("aria-label", `${config.displayName} pet`);
      label.textContent = config.displayName;
    });

    window.petOverlay.onMotion((motion) => {
      vx = motion.vx;
      vy = motion.vy;
      const nextMotionState = motion.state || "move";
      const nextForcedRow = Number.isInteger(motion.row) ? motion.row : IDLE_ROW;
      if (motionState !== nextMotionState || forcedRow !== nextForcedRow) {
        frame = 0;
        lastFrameAt = performance.now();
        scheduleNextIdleBurst(lastFrameAt);
      }
      motionState = nextMotionState;
      forcedRow = nextForcedRow;
      label.hidden = motion.showNames === false;
      idleAnimationSpeed = Number.isFinite(motion.idleAnimationSpeed) ? motion.idleAnimationSpeed : 1;
    });

    pet.addEventListener("pointerenter", () => {
      isHovered = true;
      if (motionState === "stopped") hoverRow = randomIdleRow();
      idleBursting = false;
      idleBurstFramesRemaining = 0;
    });

    pet.addEventListener("pointerleave", () => {
      if (activePointerId !== null) return;
      isHovered = false;
      hoverRow = IDLE_ROW;
      frame = 0;
      scheduleNextIdleBurst();
    });

    pet.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      activePointerId = event.pointerId;
      isHovered = true;
      pet.setPointerCapture(event.pointerId);
      pet.classList.add("dragging");
      window.petOverlay.dragStart(screenPoint(event));
    });

    pet.addEventListener("pointermove", (event) => {
      if (activePointerId !== event.pointerId) return;
      window.petOverlay.dragMove(screenPoint(event));
    });

    pet.addEventListener("pointerup", (event) => {
      if (activePointerId !== event.pointerId) return;
      if (pet.hasPointerCapture(event.pointerId)) pet.releasePointerCapture(event.pointerId);
      activePointerId = null;
      isHovered = pet.matches(":hover");
      pet.classList.remove("dragging");
      window.petOverlay.dragEnd();
    });

    pet.addEventListener("pointercancel", () => {
      activePointerId = null;
      isHovered = pet.matches(":hover");
      pet.classList.remove("dragging");
      window.petOverlay.dragEnd();
    });

    pet.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      window.petOverlay.openMenu(screenPoint(event));
    });

    function tick(now) {
      const speed = Math.hypot(vx, vy);
      const isDragged = motionState === "drag";
      const isMoving = motionState === "move" && speed > 16;
      const activePlayback = isHovered || isDragged || isMoving;
      if (Math.abs(vx) > 4) facingRow = vx >= 0 ? RUN_RIGHT_ROW : RUN_LEFT_ROW;

      const nextRow = isHovered && motionState === "stopped" && !isDragged
        ? hoverRow
        : motionState === "stopped" || motionState === "interact"
        ? nonRunningRow(forcedRow)
        : (isMoving || isDragged ? facingRow : IDLE_ROW);
      if (row !== nextRow) {
        row = nextRow;
        frame = 0;
        lastFrameAt = now;
      }

      const frameCount = ROW_FRAME_COUNTS[row] || atlas.columns;
      const frameMs = ((isMoving || isDragged) ? ACTIVE_FRAME_MS : IDLE_FRAME_MS) / Math.max(0.25, idleAnimationSpeed);

      if (activePlayback) {
        idleBursting = false;
        idleBurstFramesRemaining = 0;
        if (now - lastFrameAt >= frameMs) {
          frame = (frame + 1) % frameCount;
          lastFrameAt = now;
        }
      } else {
        if (!idleBursting && now >= nextIdleBurstAt) {
          idleBursting = true;
          idleBurstFramesRemaining = frameCount;
          lastFrameAt = now;
        }
        if (idleBursting && now - lastFrameAt >= frameMs) {
          frame = (frame + 1) % frameCount;
          idleBurstFramesRemaining -= 1;
          lastFrameAt = now;
          if (idleBurstFramesRemaining <= 0) {
            frame = 0;
            scheduleNextIdleBurst(now);
          }
        } else if (!idleBursting) {
          frame = 0;
        }
      }
      frame %= frameCount;
      pet.style.backgroundPosition = `-${frame * atlas.cellWidth}px -${row * atlas.cellHeight}px`;
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
