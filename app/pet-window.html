<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet Window</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
    }

    .pet {
      position: absolute;
      left: 0;
      top: 0;
      width: 192px;
      height: 208px;
      background-repeat: no-repeat;
      background-size: 1536px 1872px;
      filter: drop-shadow(0 14px 12px rgba(0, 0, 0, 0.3));
      transform-origin: 0 0;
      cursor: grab;
      touch-action: none;
    }

    .pet.dragging {
      cursor: grabbing;
    }

    .label {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      max-width: calc(100% - 8px);
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(12, 14, 18, 0.72);
      color: rgba(255, 255, 255, 0.92);
      font: 11px/15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <section id="pet" class="pet" aria-label="Pet"></section>
  <div id="label" class="label"></div>

  <script>
    const CELL_W = 192;
    const CELL_H = 208;
    const COLS = 8;
    const IDLE_ROW = 0;
    const RUN_RIGHT_ROW = 1;
    const RUN_LEFT_ROW = 2;
    const ROW_FRAME_COUNTS = {
      0: 6,
      1: 8,
      2: 8,
      3: 4,
      4: 5,
      5: 8,
      6: 6,
      7: 6,
      8: 6
    };

    const pet = document.getElementById("pet");
    const label = document.getElementById("label");

    let frame = 0;
    let row = IDLE_ROW;
    let vx = 0;
    let vy = 0;
    let motionState = "idle";
    let forcedRow = IDLE_ROW;
    let idleAnimationSpeed = 1;
    let lastFrameAt = performance.now();
    let activePointerId = null;

    function screenPoint(event) {
      return { x: Math.round(event.screenX), y: Math.round(event.screenY) };
    }

    window.petOverlay.onConfig((config) => {
      pet.style.backgroundImage = `url("${config.sprite}")`;
      pet.style.transform = `scale(${config.scale})`;
      pet.setAttribute("aria-label", `${config.displayName} pet`);
      label.textContent = config.displayName;
    });

    window.petOverlay.onMotion((motion) => {
      vx = motion.vx;
      vy = motion.vy;
      motionState = motion.state || "move";
      forcedRow = Number.isInteger(motion.row) ? motion.row : IDLE_ROW;
      idleAnimationSpeed = Number.isFinite(motion.idleAnimationSpeed) ? motion.idleAnimationSpeed : 1;
    });

    pet.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      activePointerId = event.pointerId;
      pet.setPointerCapture(event.pointerId);
      pet.classList.add("dragging");
      window.petOverlay.dragStart(screenPoint(event));
    });

    pet.addEventListener("pointermove", (event) => {
      if (activePointerId !== event.pointerId) return;
      window.petOverlay.dragMove(screenPoint(event));
    });

    pet.addEventListener("pointerup", (event) => {
      if (activePointerId !== event.pointerId) return;
      if (pet.hasPointerCapture(event.pointerId)) pet.releasePointerCapture(event.pointerId);
      activePointerId = null;
      pet.classList.remove("dragging");
      window.petOverlay.dragEnd();
    });

    pet.addEventListener("pointercancel", () => {
      activePointerId = null;
      pet.classList.remove("dragging");
      window.petOverlay.dragEnd();
    });

    pet.addEventListener("contextmenu", (event) => {
      event.preventDefault();
      window.petOverlay.openMenu(screenPoint(event));
    });

    function tick(now) {
      const speed = Math.hypot(vx, vy);
      const usesIdleTiming = motionState !== "move" || speed <= 16;
      const frameMs = (usesIdleTiming ? 150 : 105) / Math.max(0.25, idleAnimationSpeed);
      if (now - lastFrameAt >= frameMs) {
        frame = (frame + 1) % COLS;
        lastFrameAt = now;
      }
      if (motionState === "stopped" || motionState === "interact") {
        row = forcedRow;
      } else {
        row = speed <= 16 ? IDLE_ROW : (vx >= 0 ? RUN_RIGHT_ROW : RUN_LEFT_ROW);
      }
      frame %= ROW_FRAME_COUNTS[row] || COLS;
      pet.style.backgroundPosition = `-${frame * CELL_W}px -${row * CELL_H}px`;
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
