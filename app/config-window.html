<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wake Pets v1 and v2</title>
  <style>
    :root {
      color-scheme: light dark;
      --window: rgba(242, 242, 247, 0.78);
      --titlebar: #f2f2f7;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-strong: rgba(255, 255, 255, 0.9);
      --separator: rgba(60, 60, 67, 0.16);
      --text: #1d1d1f;
      --muted: rgba(60, 60, 67, 0.68);
      --control: rgba(255, 255, 255, 0.86);
      --control-hover: rgba(255, 255, 255, 0.98);
      --blue: #007aff;
      --danger: #ff3b30;
      --green: #30d158;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.15);
      background: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --window: rgba(28, 28, 30, 0.78);
        --titlebar: #1c1c1e;
        --panel: rgba(44, 44, 46, 0.72);
        --panel-strong: rgba(58, 58, 60, 0.86);
        --separator: rgba(235, 235, 245, 0.13);
        --text: #f5f5f7;
        --muted: rgba(235, 235, 245, 0.62);
        --control: rgba(72, 72, 74, 0.86);
        --control-hover: rgba(84, 84, 86, 0.98);
        --shadow: 0 18px 48px rgba(0, 0, 0, 0.34);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: transparent;
    }

    body {
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr);
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: var(--window);
      -webkit-font-smoothing: antialiased;
    }

    header {
      height: 44px;
      border-bottom: 1px solid var(--separator);
      background: var(--titlebar);
      -webkit-app-region: drag;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    main {
      min-height: 0;
      overflow: auto;
      padding: 16px;
    }

    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      padding: 2px 2px 0;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      -webkit-app-region: no-drag;
    }

    button,
    input {
      font: inherit;
      -webkit-app-region: no-drag;
    }

    button {
      appearance: none;
      border: 1px solid var(--separator);
      border-radius: 7px;
      background: var(--control);
      color: var(--text);
      padding: 5px 11px 6px;
      font-size: 12px;
      line-height: 16px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.42) inset;
    }

    button:hover {
      background: var(--control-hover);
    }

    button.primary {
      background: var(--blue);
      color: white;
      border-color: rgba(0, 86, 179, 0.44);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.32) inset, 0 7px 18px rgba(0, 122, 255, 0.22);
    }

    button.danger {
      color: var(--danger);
    }

    .panel,
    .pets {
      display: grid;
      gap: 10px;
    }

    .panel {
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--separator);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px) saturate(150%);
    }

    .panel-title {
      margin: 0;
      padding: 0 2px 1px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .setting {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 46px;
      padding: 9px 10px;
      border: 1px solid var(--separator);
      border-radius: 10px;
      background: var(--panel-strong);
      font-size: 13px;
    }

    .setting-copy {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .setting-title {
      font-weight: 590;
      letter-spacing: -0.01em;
    }

    .setting-hint {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .setting-control,
    .range-control {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--blue);
    }

    input[type="range"] {
      width: 158px;
      accent-color: var(--blue);
    }

    .value-chip,
    .scale-value {
      min-width: 48px;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(120, 120, 128, 0.16);
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .pet {
      display: grid;
      grid-template-columns: 76px minmax(0, 1fr) auto;
      align-items: center;
      column-gap: 12px;
      row-gap: 10px;
      padding: 12px;
      border: 1px solid var(--separator);
      border-radius: 14px;
      background: var(--panel);
      backdrop-filter: blur(18px) saturate(140%);
    }

    .pet-preview {
      grid-column: 1;
      grid-row: 1 / 3;
      align-self: stretch;
      min-height: 76px;
      border: 1px solid var(--separator);
      border-radius: 10px;
      background-color: rgba(120, 120, 128, 0.1);
      background-repeat: no-repeat;
      background-position: 0 0;
      background-size: 800% 900%;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    .name {
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 620;
      letter-spacing: -0.01em;
    }

    .status {
      width: max-content;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(120, 120, 128, 0.14);
      color: var(--muted);
      font-size: 12px;
      text-align: right;
      grid-column: 3;
      grid-row: 1;
      justify-self: end;
    }

    .status.running {
      background: rgba(48, 209, 88, 0.16);
      color: var(--green);
    }

    .size-control {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      grid-template-columns: auto minmax(92px, 1fr) auto;
      align-items: center;
      gap: 9px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .size-control input[type="range"] {
      width: 100%;
    }

    .size-control input:disabled {
      opacity: 0.45;
    }

    .size-presets {
      grid-column: 2 / 4;
      display: flex;
      gap: 6px;
      min-width: 0;
    }

    .size-preset {
      min-width: 64px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .size-preset.active {
      border-color: rgba(0, 122, 255, 0.56);
      background: var(--blue);
      color: white;
    }

    .size-preset:disabled {
      opacity: 0.45;
    }

    .pet-action {
      grid-column: 3;
      grid-row: 2;
      justify-self: end;
      align-self: center;
      min-width: 92px;
      text-align: center;
    }
  </style>
</head>
<body>
  <header aria-hidden="true"></header>
  <main>
    <section class="content-header">
      <h1>Wake Pets v1 and v2</h1>
      <div class="toolbar">
        <button id="spawn" class="primary" type="button">Wake All</button>
        <button id="despawn-all" class="danger" type="button">Despawn All</button>
      </div>
    </section>
    <section class="panel">
      <h2 class="panel-title">Overlay</h2>
      <label class="setting">
        <span class="setting-copy">
          <span class="setting-title">Movement</span>
          <span class="setting-hint">Let pets wander around the screen.</span>
        </span>
        <span class="setting-control"><input id="movement" type="checkbox"></span>
      </label>
      <label class="setting">
        <span class="setting-copy">
          <span class="setting-title">Pet collisions</span>
          <span class="setting-hint">Pause and react when pets bump into each other.</span>
        </span>
        <span class="setting-control"><input id="collisions" type="checkbox"></span>
      </label>
      <label class="setting">
        <span class="setting-copy">
          <span class="setting-title">Show names</span>
          <span class="setting-hint">Display each pet's name below its sprite.</span>
        </span>
        <span class="setting-control"><input id="show-names" type="checkbox"></span>
      </label>
      <label class="setting">
        <span class="setting-copy">
          <span class="setting-title">Movement speed</span>
          <span class="setting-hint">Controls how quickly pets travel.</span>
        </span>
        <span class="setting-control range-control">
          <span id="speed-value" class="value-chip"></span>
          <input id="speed" type="range" min="0.25" max="2.5" step="0.05">
        </span>
      </label>
      <label class="setting">
        <span class="setting-copy">
          <span class="setting-title">Idle animation</span>
          <span class="setting-hint">Controls stopped and idle frame timing.</span>
        </span>
        <span class="setting-control range-control">
          <span id="idle-animation-value" class="value-chip"></span>
          <input id="idle-animation-speed" type="range" min="0.25" max="2.5" step="0.05">
        </span>
      </label>
    </section>
    <div id="pets" class="pets"></div>
  </main>

  <script>
    const petsEl = document.getElementById("pets");
    const spawnButton = document.getElementById("spawn");
    const despawnAllButton = document.getElementById("despawn-all");
    const movement = document.getElementById("movement");
    const collisions = document.getElementById("collisions");
    const showNames = document.getElementById("show-names");
    const speed = document.getElementById("speed");
    const speedValue = document.getElementById("speed-value");
    const idleAnimationSpeed = document.getElementById("idle-animation-speed");
    const idleAnimationValue = document.getElementById("idle-animation-value");
    let state = { installedPets: [], runningPets: [] };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function formatMultiplier(value) {
      return `${Number(value).toFixed(2)}x`;
    }

    function formatScale(value) {
      return `${Math.round(Number(value) * 100)}%`;
    }

    function relativeSizeForScale(scale, defaultScale) {
      return Number.isFinite(scale) && Number.isFinite(defaultScale) && defaultScale > 0 ? scale / defaultScale : 1;
    }

    function scaleForRelativeSize(relativeSize, defaultScale) {
      return Number.isFinite(relativeSize) && Number.isFinite(defaultScale) && defaultScale > 0 ? relativeSize * defaultScale : NaN;
    }

    function render() {
      const running = new Set(state.runningPets);
      const petDetails = new Map((state.runningPetDetails || []).map((pet) => [pet.id, pet]));
      const scaleLimits = state.petScaleLimits || { min: 0.25, max: 3, step: 0.01 };
      const settings = state.overlaySettings || {};
      movement.checked = settings.movementEnabled === true;
      collisions.checked = settings.collisionsEnabled !== false;
      showNames.checked = settings.showNames !== false;
      speed.value = settings.speedMultiplier || 1;
      speedValue.textContent = formatMultiplier(speed.value);
      idleAnimationSpeed.value = settings.idleAnimationSpeed || 1;
      idleAnimationValue.textContent = formatMultiplier(idleAnimationSpeed.value);
      petsEl.innerHTML = "";
      for (const pet of state.installedPets) {
        const isRunning = running.has(pet.id);
        const detail = petDetails.get(pet.id) || {};
        const scale = Number(detail.scale);
        const defaultScale = Number(detail.defaultScale || pet.defaultScale);
        const currentSize = relativeSizeForScale(scale, defaultScale);
        const id = escapeHtml(pet.id);
        const displayName = escapeHtml(pet.displayName);
        const row = document.createElement("section");
        row.className = "pet";
        row.innerHTML = `
          <div class="pet-preview" aria-hidden="true"></div>
          <div class="name">${displayName}</div>
          <div class="status ${isRunning ? "running" : ""}">${isRunning ? "Running" : "Sleeping"}</div>
          <label class="size-control">
            <span>Size</span>
            <input data-pet-scale="${id}" data-default-scale="${defaultScale}" type="range" min="${scaleLimits.min}" max="${scaleLimits.max}" step="${scaleLimits.step}" value="${currentSize}" ${isRunning ? "" : "disabled"}>
            <span class="scale-value">${formatScale(currentSize)}</span>
          </label>
          <div class="size-presets" role="group" aria-label="Quick sizes">
            <button class="size-preset ${Math.abs(currentSize - 1) < 0.005 ? "active" : ""}" data-pet-scale-preset="${id}" data-default-scale="${defaultScale}" data-size-preset="1" type="button" aria-pressed="${Math.abs(currentSize - 1) < 0.005}" ${isRunning ? "" : "disabled"}>100%</button>
            <button class="size-preset ${Math.abs(currentSize - 1.75) < 0.005 ? "active" : ""}" data-pet-scale-preset="${id}" data-default-scale="${defaultScale}" data-size-preset="1.75" type="button" aria-pressed="${Math.abs(currentSize - 1.75) < 0.005}" ${isRunning ? "" : "disabled"}>175%</button>
          </div>
          ${isRunning ? `<button data-despawn="${id}" class="pet-action" type="button">Despawn</button>` : `<button data-wake="${id}" class="pet-action primary" type="button">Wake</button>`}
        `;
        const preview = row.querySelector(".pet-preview");
        const atlas = pet.atlas || { columns: 8, rows: 9 };
        preview.style.backgroundSize = `${Number(atlas.columns) || 8}00% ${Number(atlas.rows) || 9}00%`;
        preview.style.backgroundImage = `url("${pet.sprite}")`;
        petsEl.appendChild(row);
      }
    }

    function updateSizePresetState(row, value) {
      for (const button of row.querySelectorAll("[data-pet-scale-preset]")) {
        const active = Math.abs(Number(button.dataset.sizePreset) - Number(value)) < 0.005;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      }
    }

    petsEl.addEventListener("click", (event) => {
      const wakeId = event.target.dataset?.wake;
      const id = event.target.dataset?.despawn;
      const presetId = event.target.dataset?.petScalePreset;
      if (presetId) {
        const size = Number(event.target.dataset.sizePreset);
        const defaultScale = Number(event.target.dataset.defaultScale);
        if (Number.isFinite(size) && Number.isFinite(defaultScale)) {
          window.petOverlay.setPetScale(presetId, size * defaultScale);
          const row = event.target.closest(".pet");
          const slider = row?.querySelector("input[data-pet-scale]");
          const value = row?.querySelector(".scale-value");
          if (slider) slider.value = String(size);
          if (value) value.textContent = formatScale(size);
          if (row) updateSizePresetState(row, size);
        }
      }
      if (wakeId) window.petOverlay.spawnPets([wakeId]);
      if (id) window.petOverlay.despawnPet(id);
    });

    petsEl.addEventListener("input", (event) => {
      const id = event.target.dataset?.petScale;
      if (!id) return;
      const scale = scaleForRelativeSize(Number(event.target.value), Number(event.target.dataset.defaultScale));
      window.petOverlay.setPetScale(id, scale);
      const value = event.target.closest(".size-control")?.querySelector(".scale-value");
      if (value) value.textContent = formatScale(event.target.value);
      const row = event.target.closest(".pet");
      if (row) updateSizePresetState(row, Number(event.target.value));
    });

    spawnButton.addEventListener("click", () => {
      window.petOverlay.spawnPets(state.installedPets.map((pet) => pet.id));
    });

    despawnAllButton.addEventListener("click", () => {
      window.petOverlay.despawnAll();
    });

    function pushSettings() {
      window.petOverlay.updateOverlaySettings({
        movementEnabled: movement.checked,
        collisionsEnabled: collisions.checked,
        showNames: showNames.checked,
        speedMultiplier: Number(speed.value),
        idleAnimationSpeed: Number(idleAnimationSpeed.value)
      });
      speedValue.textContent = formatMultiplier(speed.value);
      idleAnimationValue.textContent = formatMultiplier(idleAnimationSpeed.value);
    }

    movement.addEventListener("change", pushSettings);
    collisions.addEventListener("change", pushSettings);
    showNames.addEventListener("change", pushSettings);
    speed.addEventListener("input", pushSettings);
    idleAnimationSpeed.addEventListener("input", pushSettings);

    window.petOverlay.onState((nextState) => {
      state = nextState;
      render();
    });

    window.petOverlay.requestState();
  </script>
</body>
</html>
